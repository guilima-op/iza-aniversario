<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabéns, Velha 👀</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(270deg, #5f0a87, #a4508b, #6a0dad);
            background-size: 600% 600%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .card {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            max-width: 350px;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        img {
            width: 180px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 3px solid white;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #6a0dad;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ddd;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="https://th.bing.com/th/id/OIP.G89-uqc5YDVteMAMkc2vpgHaHa?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagem da aniversariante">

        <h1>🎉 Parabéns, velha! 🎉</h1>

        <p>
            Mais um ano de vida... e incrivelmente você ainda não virou uma relíquia de museu 😌<br><br>
            Obrigado por ser essa irmã incrível (às vezes irritante).<br><br>
            Te desejo tudo de bom… inclusive paciência pra me aguentar mais alguns anos 😎
        </p>

        <button onclick="alert('Presente? Eu sou o presente 😌')">
            Clique aqui 🎁
        </button>
    </div>

</body>

</html>
